apiVersion: 1

groups:
  - orgId: 1
    name: markethawk-infrastructure
    folder: MarketHawk
    interval: 1m
    rules:
      - uid: ibkr-disconnected
        title: IBKR Disconnected
        condition: C
        for: 2m
        annotations:
          summary: IBKR Gateway has been disconnected for more than 2 minutes
        labels:
          severity: critical
        data:
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: ibkr_connection_status
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B < 1

      - uid: high-celery-failure-rate
        title: High Celery Task Failure Rate
        condition: C
        for: 5m
        annotations:
          summary: Celery task failure rate exceeds 10% over the last 5 minutes
        labels:
          severity: warning
        data:
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(celery_tasks_total{status="failure"}[5m]))
                /
                sum(rate(celery_tasks_total[5m]))
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B > 0.1

      - uid: db-pool-overflow
        title: DB Pool Overflow
        condition: C
        for: 5m
        annotations:
          summary: SQLAlchemy connection pool overflow is non-zero for more than 5 minutes
        labels:
          severity: warning
        data:
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: db_pool_overflow
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B > 0

      - uid: high-api-error-rate
        title: High API Error Rate
        condition: C
        for: 5m
        annotations:
          summary: HTTP 5xx error rate exceeds 5 errors/min
        labels:
          severity: warning
        data:
          - refId: B
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(rate(http_requests_total{status_code=~"5.."}[1m])) * 60
              refId: B
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B > 5

      - uid: tweet-monitor-auth-expired
        title: Tweet-Monitor Auth Expired
        condition: C
        for: 2m
        annotations:
          summary: >
            Tweet-monitor X.com cookie auth has been failing for 2+ minutes.
            Rotate X_AUTH_TOKEN and X_CSRF_TOKEN in .env and restart tweet-monitor.
        labels:
          severity: warning
        data:
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: tweet_monitor_auth_ok
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B < 1

      - uid: scan-missed-slot-pre-market
        title: Pre-Market Scan Missed Slot
        condition: C
        for: 0m
        annotations:
          summary: >
            pre_market_volume_spike has not completed successfully for >15 min
            during the pre-market window (04:00–09:30 ET). Check Celery worker health.
        labels:
          severity: critical
        data:
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              # Time since last successful scan. SCAN_STALENESS_SLO_SECONDS default: 900
              expr: time() - scan_last_success_timestamp{scanner_type="pre_market_volume_spike"}
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              # Gate to 08:00–15:00 UTC via Grafana alert rule "Active time range"
              # (weekdays, 08:00–15:00 UTC) in the Grafana UI after provisioning.
              expression: $B > 900

      - uid: scan-duration-slo-breach
        title: Scanner p95 Duration Exceeds SLO
        condition: C
        for: 5m
        annotations:
          summary: >
            {{ $labels.scanner_type }} p95 scan duration exceeds the 120-second SLO.
            Tune threshold via SCAN_DURATION_SLO_SECONDS env var.
        labels:
          severity: warning
        data:
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              # SCAN_DURATION_SLO_SECONDS default: 120
              expr: >
                histogram_quantile(0.95,
                  sum(rate(scan_duration_seconds_bucket[15m])) by (le, scanner_type)
                )
              refId: B
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B > 120

      - uid: scan-high-failed-ticker-ratio
        title: Scanner High Failed-Ticker Ratio
        condition: C
        for: 0m
        annotations:
          summary: >
            {{ $labels.scanner_type }} had >10% failed tickers on the last run.
            Check provider connectivity (Polygon/IBKR) or universe health.
        labels:
          severity: warning
        data:
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: scan_failed_tickers_ratio
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B > 0.1

      - uid: polygon-provider-degraded
        title: Polygon Provider Degraded
        condition: E
        for: 2m
        annotations:
          summary: >
            Polygon market data is degraded: circuit breaker open in some process,
            rolling 5-minute error rate >= 25% (POLYGON_HEALTH_ERROR_RATE_THRESHOLD),
            or the per-ticker WebSocket stream is disconnected. Live-day pre-market
            scans stop or are marked degraded (ADR-0013). See deployment-guide.md
            "Pre-Market Data Degradation Runbook".
        labels:
          severity: critical
        data:
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # 0=closed, 1=half-open, 2=open (worst across processes)
              expr: max(provider_circuit_breaker_state{provider="polygon"})
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(provider_error_rate{provider="polygon"})
              refId: C
          - refId: D
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # 1=connected, 0=disconnected, -1=disabled by config (never alerts)
              expr: max(polygon_ws_connected)
              refId: D
          - refId: E
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B >= 2 || $C >= 0.25 || $D == 0

      - uid: polygon-latency-elevated
        title: Polygon Latency Elevated
        condition: C
        for: 5m
        annotations:
          summary: >
            Polygon rolling 15-minute p95 latency exceeds 5 s
            (POLYGON_HEALTH_LATENCY_P95_THRESHOLD_SECONDS). Scans continue but are
            marked degraded (warning) per ADR-0013 — informational, not a page.
        labels:
          severity: warning
        data:
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(provider_request_latency_p95_seconds{provider="polygon"})
              refId: B
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B > 5

      - uid: pre-market-scan-provider-gap
        title: Pre-Market Scan Ran on Degraded Data
        condition: C
        for: 0m
        annotations:
          summary: >
            The latest pre_market_volume_spike run on today's session recorded a
            blocker provider_gap (no/stale pre-market minute bars, breaker open, or
            high error rate). Check the run's quality_gate via
            GET /api/v1/scanner/history?data_degraded=true and the Polygon panels.
        labels:
          severity: critical
        data:
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # 0=none, 1=warning, 2=blocker
              expr: max(scan_provider_gap_severity{scanner_type="pre_market_volume_spike"})
              refId: B
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B >= 2

  - name: LiveTrading
    orgId: 1
    folder: MarketHawk
    interval: 1m
    rules:
      - uid: live-order-placed
        title: Live Order Placed
        condition: C
        for: 0m
        annotations:
          summary: >
            A live bracket order was submitted to IBKR.
            Symbol: {{ $labels.symbol }}, Side: {{ $labels.side }}
        labels:
          severity: critical
        data:
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(live_orders_total[1m])
              refId: B
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: "-- Grafana --"
            model:
              type: math
              expression: $B > 0
